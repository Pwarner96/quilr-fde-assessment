[build-system]
requires = ["uv_build==0.12.9"]
build-backend = "uv_build"

[project]
name = "quilr-fde-assessment"
version = "0.1.0"
description = "Four independently runnable components for the Quilr FDE / AI Solutions Engineer assessment."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==2.1.1", "pydantic==2.13.5", "fastapi==0.141.1", "uvicorn==0.52.4", "httpx==0.28.1", "PyJWT==2.13.0", "aiosqlite==0.22.1"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "hypothesis==6.167.1", "respx==0.23.1", "pytest-cov==7.1.0", "coverage==7.16.0", "ruff==0.16.6", "mypy==2.3.1"]

[tool.uv.build-backend]
module-name = "fde_assessment"

[tool.uv]
constraint-dependencies = [
  "cryptography==48.0.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "cryptography==50.0.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
